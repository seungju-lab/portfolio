name: portfolio-prod

services:
  frontend:
    image: portfolio:prod
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    init: true
    restart: unless-stopped
    ports:
      - "3001:80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --output-document=- http://127.0.0.1/ >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
